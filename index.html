<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج تسجيل الدخول</title>
  <style>
    /* تنسيق الخفية وترتيب الصفحة في المنتصف */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* مربع تسجيل الدخول الرئيسي */
    .login-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    /* عنوان النموذج */
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    /* تنسيق خانات الكتابة (البريد والكلمة السرية) */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    /* صف مربع "تذكرني" وزر "تسجيل الدخول" بجانب بعضهما */
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
    }

    /* تنسيق checkbox والمحاذاة مع النص */
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* تنسيق زر تسجيل الدخول */
    .btn-login {
      padding: 9px 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-login:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    
    <form action="#" method="POST">
      <!-- خانة البريد الإلكتروني -->
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required placeholder="أدخل بريدك الإلكتروني">
      </div>

      <!-- خانة كلمة المرور -->
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
      </div>

      <!-- الجزء الخاص بمربع "تذكرني" والزر بجانبه -->
      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" name="remember" id="remember">
          <span>تذكرني</span>
        </label>

        <button type="submit" class="btn-login">دخول</button>
      </div>
    </form>
  </div>

</body>
</html>
