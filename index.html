<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزارة حمكشة - إدارة العملاء والطلبات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js للرسم البياني -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- 📊 1. داشبورد تحليلات العملاء -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-blue-600"></i> داشبورد تحليلات العملاء
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
                    <p class="text-gray-500 text-sm">إجمالي العملاء</p>
                    <h3 id="statTotalCustomers" class="text-2xl font-bold text-blue-700">0</h3>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100 text-center">
                    <p class="text-gray-500 text-sm">عملاء جدد (هذا الشهر)</p>
                    <h3 id="statNewCustomers" class="text-2xl font-bold text-green-700">0</h3>
                </div>
                <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 text-center">
                    <p class="text-gray-500 text-sm">تحولوا لعملاء دائمين</p>
                    <h3 id="statConvertedCustomers" class="text-2xl font-bold text-purple-700">0</h3>
                </div>
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100 text-center">
                    <p class="text-gray-500 text-sm">عملاء VIP</p>
                    <h3 id="statVipCustomers" class="text-2xl font-bold text-amber-700">0</h3>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 📝 2. نموذج إضافة / تعديل عميل -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-blue-600"></i> <span id="formTitle">إضافة عميل جديد</span>
                    </h2>
                    <button id="btnCancelEdit" onclick="resetForm()" class="hidden text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-md hover:bg-gray-300">إلغاء التعديل</button>
                </div>

                <form id="customerForm" onsubmit="handleCustomerSubmit(event)" class="space-y-3">
                    <input type="hidden" id="customerId">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">اسم العميل</label>
                        <input type="text" id="customerName" required placeholder="مثال: أحمد محمود" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">رقم الهاتف</label>
                        <input type="tel" id="customerPhone" required placeholder="010XXXXXXXX" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">العنوان / المنطقة</label>
                        <textarea id="customerAddress" rows="2" required placeholder="مثال: الزقازيق - الشارع التجاري" class="w-full border rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                    <button type="submit" id="btnSubmitCustomer" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 transition shadow">
                        💾 حفظ بيانات العميل
                    </button>
                </form>
            </div>

            <!-- 👥 3. قاعدة بيانات العملاء والفلترة -->
            <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-users text-blue-600"></i> قاعدة بيانات العملاء
                    </h2>
                    <!-- البحث والفلترة -->
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="searchInput" oninput="filterCustomers()" placeholder="🔎 بحث بالاسم أو الهاتف..." class="border rounded-xl px-3 py-1.5 text-sm w-full md:w-48 outline-none focus:ring-2 focus:ring-blue-500">
                        <select id="categoryFilter" onchange="filterCustomers()" class="border rounded-xl px-3 py-1.5 text-sm outline-none bg-gray-50">
                            <option value="ALL">كل التصنيفات</option>
                            <option value="جديد">عميل جديد 🆕</option>
                            <option value="دائم">عميل دائم 🔄</option>
                            <option value="VIP">VIP ⭐</option>
                        </select>
                    </div>
                </div>

                <!-- قائمة العملاء -->
                <div id="customersList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- سيتم إضافة كروت العملاء هنا تلقائياً -->
                </div>
            </div>

        </div>

    </div>

    <!-- 🧾 4. نافذة كشف الحساب (Modal) -->
    <div id="statementModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 class="text-lg font-bold text-gray-800 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice-dollar text-green-600"></i> كشف حساب العميل: <span id="modalCustomerName" class="text-blue-600"></span>
            </h3>
            <p id="modalCustomerInfo" class="text-xs text-gray-500 mb-4"></p>

            <div class="grid grid-cols-2 gap-3 mb-4 bg-gray-50 p-3 rounded-xl border text-center">
                <div>
                    <span class="text-xs text-gray-500 block">إجمالي الطلبات</span>
                    <strong id="modalTotalOrders" class="text-base text-gray-800">0 أوردرات</strong>
                </div>
                <div>
                    <span class="text-xs text-gray-500 block">إجمالي المسحوبات</span>
                    <strong id="modalTotalAmount" class="text-base text-green-600">0 ج.م</strong>
                </div>
            </div>

            <h4 class="font-bold text-sm text-gray-700 mb-2">سجل الطلبات</h4>
            <table class="w-full text-xs text-right border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 border-b">
                        <th class="p-2">رقم الأوردر</th>
                        <th class="p-2">التاريخ</th>
                        <th class="p-2">تفاصيل الطلب</th>
                        <th class="p-2">المبلغ</th>
                        <th class="p-2">الحالة</th>
                    </tr>
                </thead>
                <tbody id="modalOrdersTable">
                    <!-- تفاصيل الأوردرات -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript Code -->
    <script>
        // ⚙️ إعدادات الفايربيز (Firebase Config)
        const firebaseConfig = {
            databaseURL: "https://YOUR_FIREBASE_DATABASE_URL.firebaseio.com" // ضع رابط قاعدة بياناتك هنا
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allCustomers = [];
        let allOrders = [];

        // 🔄 تحميل البيانات فور فتح الصفحة
        window.onload = function() {
            listenToCustomers();
            listenToOrders();
        };

        // 1️⃣ الاستماع لتغيرات العملاء في الفايربيز
        function listenToCustomers() {
            db.ref('customers').on('value', snapshot => {
                allCustomers = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        allCustomers.push({ id: key, ...data[key] });
                    });
                }
                renderCustomers();
                updateDashboardStats();
            });
        }

        // 2️⃣ الاستماع للأوردرات للربط التلقائي وتصنيف العملاء
        function listenToOrders() {
            db.ref('orders').on('value', snapshot => {
                allOrders = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        allOrders.push({ id: key, ...data[key] });
                    });
                }
                renderCustomers();
                updateDashboardStats();
            });
        }

        // 📊 حساب تصنيف العميل تلقائياً (جديد / دائم / VIP)
        function getCustomerCategory(phone) {
            const customerOrders = allOrders.filter(o => o.customerPhone === phone);
            const totalSpent = customerOrders.reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0);
            
            if (totalSpent >= 5000 || customerOrders.length >= 10) return { name: 'VIP', badge: 'bg-amber-100 text-amber-800 border-amber-300' };
            if (customerOrders.length >= 3) return { name: 'دائم', badge: 'bg-purple-100 text-purple-800 border-purple-300' };
            return { name: 'جديد', badge: 'bg-green-100 text-green-800 border-green-300' };
        }

        // 🖼️ عرض العملاء في الواجهة
        function renderCustomers() {
            const container = document.getElementById('customersList');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const filterCat = document.getElementById('categoryFilter').value;

            container.innerHTML = '';

            const filtered = allCustomers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(searchVal) || c.phone.includes(searchVal);
                const category = getCustomerCategory(c.phone).name;
                const matchesCategory = (filterCat === 'ALL') || (category === filterCat);
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-400 py-6">لا يوجد عملاء مطابقين للبحث</p>`;
                return;
            }

            filtered.forEach(c => {
                const cat = getCustomerCategory(c.phone);
                const card = document.createElement('div');
                card.className = "p-4 border rounded-xl bg-gray-50 hover:bg-white hover:shadow-sm transition flex flex-col md:flex-row justify-between items-start md:items-center gap-3";
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <h4 class="font-bold text-gray-800 text-base">${c.name}</h4>
                            <span class="text-[10px] px-2 py-0.5 rounded-full border ${cat.badge}">${cat.name}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-phone text-gray-400"></i> ${c.phone}</p>
                        <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot text-gray-400"></i> ${c.address}</p>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto justify-end border-t md:border-t-0 pt-2 md:pt-0">
                        <button onclick="openStatement('${c.phone}', '${c.name}', '${c.address}')" class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1.5 rounded-lg hover:bg-emerald-100">
                            🧾 كشف حساب
                        </button>
                        <button onclick="editCustomer('${c.id}', '${c.name}', '${c.phone}', '${c.address}')" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1.5 rounded-lg hover:bg-amber-100">
                            تعديل
                        </button>
                        <button onclick="deleteCustomer('${c.id}', '${c.name}')" class="text-xs bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1.5 rounded-lg hover:bg-rose-100">
                            حذف
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 💾 إضافة أو تعديل عميل مع التحقق من التكرار
        function handleCustomerSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('customerId').value;
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();

            // ⚠️ التحقق من تكرار رقم الهاتف عند الإضافة الجديدة
            if (!id) {
                const duplicate = allCustomers.find(c => c.phone === phone);
                if (duplicate) {
                    alert(`🚨 تحذير: هذا الرقم مسجل بالفعل باسم (${duplicate.name})!`);
                    return;
                }
            }

            const customerData = { name, phone, address, updatedAt: new Date().toISOString() };

            if (id) {
                // تعديل
                db.ref('customers/' + id).update(customerData).then(() => {
                    alert('تم تحديث بيانات العميل بنجاح ✅');
                    resetForm();
                });
            } else {
                // إضافة جديد
                customerData.createdAt = new Date().toISOString();
                db.ref('customers').push(customerData).then(() => {
                    alert('تم حفظ العميل الجديد بنجاح 🎉');
                    resetForm();
                });
            }
        }

        // ✏️ تجهيز النموذج للتعديل
        function editCustomer(id, name, phone, address) {
            document.getElementById('customerId').value = id;
            document.getElementById('customerName').value = name;
            document.getElementById('customerPhone').value = phone;
            document.getElementById('customerAddress').value = address;

            document.getElementById('formTitle').innerText = 'تعديل بيانات عميل';
            document.getElementById('btnSubmitCustomer').innerText = '🔄 تحديث البيانات';
            document.getElementById('btnCancelEdit').classList.remove('hidden');
        }

        // 🗑️ حذف عميل
        function deleteCustomer(id, name) {
            if (confirm(`هل أنت متأكد من حذف العميل (${name}) نهائياً؟`)) {
                db.ref('customers/' + id).remove().then(() => {
                    alert('تم حذف العميل بنجاح.');
                });
            }
        }

        // 🔄 إعادة ضبط النموذج
        function resetForm() {
            document.getElementById('customerForm').reset();
            document.getElementById('customerId').value = '';
            document.getElementById('formTitle').innerText = 'إضافة عميل جديد';
            document.getElementById('btnSubmitCustomer').innerText = '💾 حفظ بيانات العميل';
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        // 🔍 الفلترة والبحث
        function filterCustomers() {
            renderCustomers();
        }

        // 🧾 فتح كشف الحساب
        function openStatement(phone, name, address) {
            document.getElementById('modalCustomerName').innerText = name;
            document.getElementById('modalCustomerInfo').innerText = `${phone} - ${address}`;

            const orders = allOrders.filter(o => o.customerPhone === phone);
            const totalSpent = orders.reduce((sum, o) => sum + (Number(o.totalPrice) || 0), 0);

            document.getElementById('modalTotalOrders').innerText = `${orders.length} أوردرات`;
            document.getElementById('modalTotalAmount').innerText = `${totalSpent.toLocaleString()} ج.م`;

            const tbody = document.getElementById('modalOrdersTable');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-400">لا توجد طلبات سابقة لهذا العميل</td></tr>`;
            } else {
                orders.forEach(o => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-gray-50";
                    tr.innerHTML = `
                        <td class="p-2 font-mono">#${o.id.slice(-5)}</td>
                        <td class="p-2">${o.date || 'غير محدد'}</td>
                        <td class="p-2">${o.itemsSummary || 'لحوم متنوعة'}</td>
                        <td class="p-2 font-bold text-green-700">${o.totalPrice || 0} ج.م</td>
                        <td class="p-2"><span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded">${o.status || 'مكتمل'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('statementModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('statementModal').classList.add('hidden');
        }

        // 📈 تحديث إحصائيات الداشبورد
        function updateDashboardStats() {
            document.getElementById('statTotalCustomers').innerText = allCustomers.length;

            let news = 0, converted = 0, vips = 0;

            allCustomers.forEach(c => {
                const cat = getCustomerCategory(c.phone).name;
                if (cat === 'جديد') news++;
                if (cat === 'دائم') converted++;
                if (cat === 'VIP') vips++;
            });

            document.getElementById('statNewCustomers').innerText = news;
            document.getElementById('statConvertedCustomers').innerText = converted;
            document.getElementById('statVipCustomers').innerText = vips;
        }
    </script>
</body>
</html>
